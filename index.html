<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Paper Sums</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fffaf0; --ink:#4a3426; --ink2:#7a5d49;
    --tomato:#e8574a; --teal:#2f9e97; --mustard:#f2c14e;
    --pop:0 5px 0 rgba(74,52,38,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fbd9b0;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #app canvas{display:block;touch-action:none}
  button{font-family:inherit}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:5;pointer-events:none}
  .group{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
  .btn{font-weight:600;font-size:17px;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:14px;
    height:46px;min-width:46px;padding:0 11px;box-shadow:var(--pop);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .12s, background .2s, opacity .2s}
  .btn:hover{transform:translateY(-2px) rotate(-2deg)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,52,38,.25)}
  .btn .emo{font-size:21px;line-height:1}
  .btn.sel{background:var(--mustard)}
  .btn.muted{opacity:.45}
  #help{background:#ffe27a}
  #help.wiggle{animation:wig 1.1s ease-in-out infinite}
  @keyframes wig{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg) scale(1.1)}80%{transform:rotate(10deg) scale(1.1)}90%{transform:rotate(-6deg)}}
  #stars{cursor:default}
  #stars:hover{transform:none}
  #stars.bump{animation:bump .5s}
  @keyframes bump{30%{transform:scale(1.35) rotate(-8deg)}}
  @media (max-width:760px){ .btn .lbl{display:none} .btn{height:42px;min-width:42px;padding:0 7px;font-size:16px} .group{gap:5px} }
  @media (max-width:440px){ #hud{left:8px;right:8px;gap:6px} .btn{height:38px;min-width:38px;padding:0 5px;border-radius:12px;font-size:15px} .btn .emo{font-size:18px} .group{gap:4px;flex-wrap:nowrap} }

  /* ---------- speech bubble ---------- */
  #bubble{position:fixed;left:0;top:0;z-index:4;background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:10px 16px;
    box-shadow:var(--pop);font-weight:600;font-size:clamp(15px,1.85vw,22px);line-height:1.35;pointer-events:none;opacity:0;transition:opacity .3s;--ty:50%}
  #bubble.show{opacity:1}
  #bubble::before{content:"";position:absolute;left:-16px;top:calc(var(--ty) - 11px);border:11px solid transparent;border-right:15px solid var(--ink);border-left:0}
  #bubble::after{content:"";position:absolute;left:-10px;top:calc(var(--ty) - 8px);border:8px solid transparent;border-right:11px solid var(--cream);border-left:0}
  #bubbleText{display:block;transform-origin:left center}
  #bubbleText.pop{animation:pop .42s cubic-bezier(.3,1.7,.5,1)}
  @keyframes pop{0%{transform:scale(.75);opacity:.3}100%{transform:scale(1);opacity:1}}
  #bubble b{color:var(--tomato)}
  .ca{color:#d99a1e;font-weight:700}.sa{color:#e8574a;font-weight:700}.sb{color:#2f9e97;font-weight:700}

  /* ---------- build-mode go button ---------- */
  #go{position:fixed;left:50%;top:50%;z-index:4;display:none;transform:translate(-50%,-50%);font-size:24px;font-weight:700;color:#fff;
    background:var(--tomato);border:3px solid var(--ink);border-radius:18px;padding:10px 24px;box-shadow:0 6px 0 rgba(74,52,38,.3);cursor:pointer}
  #go.show{display:block;animation:goPop .5s cubic-bezier(.3,1.7,.5,1), goPulse 1.4s .5s ease-in-out infinite}
  @keyframes goPop{0%{transform:translate(-50%,-50%) scale(.3)}100%{transform:translate(-50%,-50%) scale(1)}}
  @keyframes goPulse{50%{transform:translate(-50%,-50%) scale(1.07) rotate(-2deg)}}

  /* ---------- start screen ---------- */
  #start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(251,217,176,.55);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .5s}
  #start.hide{opacity:0;pointer-events:none}
  .card{text-align:center;padding:20px}
  .title{font-size:clamp(52px,12vw,124px);font-weight:700;line-height:1;white-space:nowrap;filter:drop-shadow(5px 7px 0 rgba(74,52,38,.22))}
  .title span{display:inline-block;animation:bob 2.4s ease-in-out infinite;
    text-shadow:0 5px 0 #fffaf0,0 -5px 0 #fffaf0,5px 0 0 #fffaf0,-5px 0 0 #fffaf0,4px 4px 0 #fffaf0,-4px 4px 0 #fffaf0,4px -4px 0 #fffaf0,-4px -4px 0 #fffaf0}
  @keyframes bob{50%{transform:translateY(-8px) rotate(var(--r2))}}
  .sub{font-size:clamp(18px,2.6vw,26px);font-weight:600;margin:18px 0 26px}
  .sub b{color:var(--tomato)}
  #play{font-size:30px;font-weight:700;color:#fff;background:var(--teal);border:4px solid var(--ink);border-radius:22px;padding:14px 46px;
    box-shadow:0 7px 0 rgba(74,52,38,.3);cursor:pointer;transition:transform .15s}
  #play:hover{transform:scale(1.06) rotate(-2deg)}
  #play:disabled{opacity:.6;cursor:wait}
  .tiny{margin-top:18px;font-size:16px;color:var(--ink2)}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="group" id="levels">
    <button class="btn sel" data-level="1" title="Easy: no carrying"><span class="emo">🐣</span><span class="lbl">Easy</span></button>
    <button class="btn" data-level="2" title="Carrying"><span class="emo">🎒</span><span class="lbl">Carry</span></button>
    <button class="btn" data-level="3" title="Big numbers"><span class="emo">🚀</span><span class="lbl">Big</span></button>
    <button class="btn" data-level="build" title="Make your own sum"><span class="emo">✏️</span><span class="lbl">Make</span></button>
  </div>
  <div class="group">
    <div class="btn" id="stars"><span class="emo">⭐</span><span id="starCount">0</span></div>
    <button class="btn" id="help" title="Hint"><span class="emo">💡</span><span class="lbl">Help</span></button>
    <button class="btn" id="sound" title="Sounds"><span class="emo">🔊</span></button>
    <button class="btn" id="voice" title="Read hints aloud"><span class="emo">🗣️</span></button>
  </div>
</div>

<div id="bubble"><span id="bubbleText"></span></div>
<button id="go">Let's add! ➜</button>

<div id="start">
  <div class="card">
    <div class="title" id="title"></div>
    <div class="sub">Column addition with <b>Pip</b> the owl 🦉</div>
    <button id="play" disabled>Loading…</button>
    <div class="tiny">Drag the paper numbers into the boxes!</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* =====================================================================
   tiny helpers
   ===================================================================== */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  linear: t => t,
  outCubic: t => 1 - (1 - t) ** 3,
  inCubic: t => t * t * t,
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.6; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; },
};
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const digitsOf = n => String(n).split('').reverse().map(Number);

const INK = '#4a3426', RIM = '#fffaf0';
const DIGIT_COLORS = ['#e8574a', '#f08a3c', '#e9a825', '#6fae52', '#2f9e97', '#3f7fc1', '#7a5cc4', '#d9508f', '#a0643b', '#4a4f8c'];
const COL_NAMES = ['ones', 'tens', 'hundreds', 'thousands'];
const BAND_COLORS = ['#cde6f5', '#d8ecc4', '#f9d3dc', '#e4d9f6'];
const BAND_INK = ['#3f7fc1', '#4f8a3a', '#c2456f', '#6d55b5'];
const SRC = { carry: '#e9a825', a: '#e8574a', b: '#2f9e97' };
const CONF_COLORS = ['#e8574a', '#f2c14e', '#2f9e97', '#6fae52', '#3f7fc1', '#d9508f', '#f08a3c', '#fffaf0'];
const FONT_FAMILY = "'Fredoka','Arial Rounded MT Bold','Trebuchet MS',sans-serif";
const font = (px, w = 700) => `${w} ${px}px ${FONT_FAMILY}`;

// board geometry (board-local units)
const CW = 2.2, PW = 1.45, LIFT = 1.6;
const ROW = { label: 3.66, carry: 2.62, top: 1.42, bottom: -0.12, line: -0.98, answer: -2.25, tag: -3.62 };
const CARD_TOP = 4.3, CARD_BOT = -4.25, BAND_TOP = 4.08, BAND_BOT = -3.18;
const colX = (C, i) => { const total = PW + C * CW; return -total / 2 + PW + (C - 1 - i) * CW + CW / 2; };
const plusX = C => -(PW + C * CW) / 2 + PW / 2 + 0.1;

const LAY = {
  wide: { name: 'wide', w: 24.4, h: 14.4, owl: [-10.3, 5.55], owlS: 1, board: [-2.2, -0.05], panel: [8.5, 0.1], panelDir: 'v',
          tray: { y: -6.0, perRow: 10, sp: 2.05, rowGap: 0 }, sun: [13, 8.2, -13] },
  tall: { name: 'tall', w: 11.9, h: 22.4, owl: [-4.75, 9.35], owlS: 0.9, board: [0, 3.55], panel: [0, -3.1], panelDir: 'h',
          tray: { y: -7.3, perRow: 5, sp: 2.12, rowGap: 2.15 }, sun: [4.6, 13.2, -13] },
};

/* =====================================================================
   game state
   ===================================================================== */
const G = {
  L: null, level: 1, mode: 'solve', stars: 0, round: 0,
  board: null, P: null, active: 0, wrong: 0, problemWrong: 0, help: 0, streak: 0,
  busy: true, started: false, sound: true, voice: true, prompt: '', lastSay: '',
  lastAct: 0, shake: 0, camDist: 40, boardAnim: false, time: 0, nudged: false,
};
try { G.stars = +localStorage.getItem('paperSums.stars') || 0; } catch (e) {}

/* =====================================================================
   springs, juice, tweens
   ===================================================================== */
class Spring {
  constructor(v = 0, k = 300, d = 16) { this.v = v; this.t = v; this.vel = 0; this.k = k; this.d = d; }
  step(dt) { const a = this.k * (this.t - this.v) - this.d * this.vel; this.vel += a * dt; this.v += this.vel * dt; }
}
const juicy = new Set();
class Juicy {
  constructor(mesh, base = 1) {
    this.mesh = mesh; this.base = base; this.extra = 0;
    this.sq = new Spring(0, 420, 14); this.sc = new Spring(1, 320, 15); this.rot = new Spring(0, 220, 13);
    mesh.userData.j = this; juicy.add(this);
  }
  punch(a = 0.3) { this.sq.vel += a * 14; }
  pop(a = 0.3) { this.sc.vel += a * 10; }
  update(dt) {
    this.sq.step(dt); this.sc.step(dt); this.rot.step(dt);
    const s = this.base * Math.max(0.0001, this.sc.v);
    this.mesh.scale.set(s * (1 + this.sq.v), s * (1 - this.sq.v * 0.85), 1);
    this.mesh.rotation.z = this.rot.v + this.extra;
  }
  kill() { juicy.delete(this); if (this.mesh.parent) this.mesh.parent.remove(this.mesh); }
}
const tweens = [];
function tween(dur, fn, ez = ease.outCubic) { return new Promise(res => tweens.push({ t: 0, dur, fn, ez, res })); }
const wait = s => tween(s, () => {});
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt;
    const k = tw.dur <= 0 ? 1 : Math.min(1, tw.t / tw.dur);
    tw.fn(tw.ez(k), k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}

/* =====================================================================
   paper textures (canvas -> "cut-out" planes)
   ===================================================================== */
const grain = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const r = mulberry(3);
  for (let i = 0; i < 6000; i++) {
    const dark = r() < 0.55;
    g.fillStyle = dark ? `rgba(110,70,30,${0.03 + r() * 0.06})` : `rgba(255,255,255,${0.06 + r() * 0.12})`;
    g.fillRect(r() * 256, r() * 256, 1 + r() * 1.6, 1 + r() * 1.6);
  }
  g.lineWidth = 0.7;
  for (let i = 0; i < 60; i++) {
    g.strokeStyle = `rgba(120,80,40,${0.04 + r() * 0.05})`; g.beginPath();
    let x = r() * 256, y = r() * 256; g.moveTo(x, y);
    for (let k = 0; k < 5; k++) { x += (r() - 0.5) * 18; y += (r() - 0.5) * 18; g.lineTo(x, y); }
    g.stroke();
  }
  return c;
})();
const paperTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 256); g.drawImage(grain, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.16, 0.16); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

function renderCut(c, res, rim, draw) {
  const ctx = c.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height);
  ctx.setTransform(res, 0, 0, res, c.width / 2, c.height / 2);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (rim > 0) { ctx.save(); draw(ctx, { rim: true, rimW: rim, res }); ctx.restore(); }
  ctx.save(); draw(ctx, { rim: false, rimW: rim, res }); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, c.width, c.height);
  ctx.globalCompositeOperation = 'source-over';
}
function cutTex(w, h, draw, { res = 110, rim = 0.08, pad } = {}) {
  pad = pad ?? rim + 0.08;
  const W = w + pad * 2, H = h + pad * 2;
  const c = document.createElement('canvas'); c.width = Math.ceil(W * res); c.height = Math.ceil(H * res);
  renderCut(c, res, rim, draw);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return { tex, W, H, redraw(fn) { renderCut(c, res, rim, fn); tex.needsUpdate = true; } };
}
function paperMat(tex, o = {}) {
  return new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, alphaToCoverage: true, roughness: 1, metalness: 0, side: THREE.DoubleSide, ...o });
}
function cutMesh(w, h, draw, o = {}) {
  const t = cutTex(w, h, draw, o);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(t.W, t.H), paperMat(t.tex));
  m.castShadow = o.shadow !== false; m.receiveShadow = true;
  return m;
}
// fill the current path; in the rim pass it becomes the white paper border
function paint(ctx, P, fill, { shadow = true } = {}) {
  if (P.rim) { ctx.fillStyle = RIM; ctx.strokeStyle = RIM; ctx.lineWidth = P.rimW * 2; ctx.fill(); ctx.stroke(); return; }
  ctx.save();
  if (shadow) { ctx.shadowColor = 'rgba(74,52,38,0.32)'; ctx.shadowBlur = 0.05 * P.res; ctx.shadowOffsetY = 0.025 * P.res; }
  ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
function text(ctx, P, str, x, y, size, color, { weight = 700, shadow = true } = {}) {
  ctx.save(); ctx.scale(1 / P.res, 1 / P.res);
  ctx.font = font(size * P.res, weight); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText(str);
  const yy = y * P.res + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  if (P.rim) {
    ctx.lineWidth = P.rimW * 2 * P.res; ctx.strokeStyle = RIM; ctx.fillStyle = RIM;
    ctx.strokeText(str, x * P.res, yy); ctx.fillText(str, x * P.res, yy);
  } else {
    if (shadow) { ctx.shadowColor = 'rgba(74,52,38,0.3)'; ctx.shadowBlur = 0.05 * P.res; ctx.shadowOffsetY = 0.025 * P.res; }
    ctx.fillStyle = color; ctx.fillText(str, x * P.res, yy);
  }
  ctx.restore();
}
// coloured text segments, centred, auto-shrunk to maxW
function segs(ctx, P, list, x, y, size, maxW, weight = 700) {
  ctx.save(); ctx.scale(1 / P.res, 1 / P.res);
  let s = size * P.res; ctx.font = font(s, weight);
  let tot = list.reduce((a, g) => a + ctx.measureText(g.t).width, 0);
  if (tot > maxW * P.res) { s *= maxW * P.res / tot; ctx.font = font(s, weight); tot = maxW * P.res; }
  const m = ctx.measureText('8');
  const yy = y * P.res + m.actualBoundingBoxAscent / 2;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let cx = x * P.res - tot / 2;
  for (const g of list) { ctx.fillStyle = g.c || INK; ctx.fillText(g.t, cx, yy); cx += ctx.measureText(g.t).width; }
  ctx.restore();
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// a rounded rectangle with slightly wobbly, hand-cut edges
function tornRect(ctx, x, y, w, h, r, jit, seed) {
  const rnd = mulberry(seed), pts = [], step = 0.14;
  const edge = (x0, y0, x1, y1) => { const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / step)); for (let i = 0; i < n; i++) { const t = i / n; pts.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]); } };
  const arc = (cx, cy, a0) => { for (let i = 0; i < 4; i++) { const a = a0 + i / 4 * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  edge(x + r, y, x + w - r, y); arc(x + w - r, y + r, -Math.PI / 2);
  edge(x + w, y + r, x + w, y + h - r); arc(x + w - r, y + h - r, 0);
  edge(x + w - r, y + h, x + r, y + h); arc(x + r, y + h - r, Math.PI / 2);
  edge(x, y + h - r, x, y + r); arc(x + r, y + r, Math.PI);
  ctx.beginPath();
  pts.forEach(([px, py], i) => { px += (rnd() - 0.5) * jit * 2; py += (rnd() - 0.5) * jit * 2; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  ctx.closePath();
}
function starPath(ctx, n, ro, ri) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? ri : ro, a = -Math.PI / 2 + i * Math.PI / n; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
}

// blurry drop shadow for big paper cards (baked, so it never lands as a hard block on the hills)
function softShadow(w, h, { op = 0.3, blur = 0.3, r = 0.35 } = {}) {
  const res = 40, W = w + blur * 6, H = h + blur * 6;
  const c = document.createElement('canvas'); c.width = Math.ceil(W * res); c.height = Math.ceil(H * res);
  const ctx = c.getContext('2d');
  ctx.shadowColor = 'rgb(70,40,15)'; ctx.shadowBlur = blur * res; ctx.shadowOffsetX = 10000;
  ctx.translate(c.width / 2 - 10000, c.height / 2); ctx.fillStyle = '#000';
  rr(ctx, -w * res / 2, -h * res / 2, w * res, h * res, r * res); ctx.fill();
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: op, depthWrite: false }));
  m.userData.dispose = () => { tex.dispose(); m.material.dispose(); m.geometry.dispose(); };
  return m;
}

/* =====================================================================
   renderer, scene, lights
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('#app').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#fbd9b0');
const camera = new THREE.PerspectiveCamera(30, 1, 1, 300); camera.position.set(0, 0, 40);
scene.add(new THREE.HemisphereLight('#fff6ea', '#eac9a6', 2.2));
const sunLight = new THREE.DirectionalLight('#fff0da', 1.7);
sunLight.position.set(-7, 11, 18); sunLight.castShadow = true; sunLight.shadow.mapSize.set(2048, 2048);

let AC = null, master = null, noiseBuf = null;

  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }

}

  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise({ dur = 0.1, vol = 0.2, freq = 2000, f2 = null, q = 1, delay = 0 }) {

}
const PENTA = [0, 2, 4, 7, 9];
const note = i => 523.25 * 2 ** ((PENTA[i % 5] + 12 * Math.floor(i / 5)) / 12);
const sfx = {
  pick() { tone({ f: 480, f2: 900, type: 'triangle', dur: 0.1, vol: 0.13 }); noise({ dur: 0.05, vol: 0.06, freq: 3500 }); },
  snap() { noise({ dur: 0.07, vol: 0.3, freq: 1800, q: 0.7 }); tone({ f: 170, f2: 70, dur: 0.1, vol: 0.3 }); },
  good(n) { const f = note((n % 8) + 2); tone({ f, type: 'triangle', dur: 0.18, vol: 0.16 }); tone({ f: f * 1.5, dur: 0.32, vol: 0.12, delay: 0.08 }); },
  bad() { tone({ f: 260, f2: 185, dur: 0.34, vol: 0.2 }); tone({ f: 205, f2: 150, type: 'triangle', dur: 0.3, vol: 0.07, delay: 0.05 }); },
  dot(i) { tone({ f: note(i), dur: 0.14, vol: 0.13 }); tone({ f: note(i) * 2, dur: 0.06, vol: 0.03 }); },
  ten() { [0, 4, 7, 12].forEach((s, k) => tone({ f: 660 * 2 ** (s / 12), type: 'triangle', dur: 0.26, vol: 0.12, delay: k * 0.06 })); },
  win() {

  whoosh() { noise({ dur: 0.35, vol: 0.12, freq: 350, f2: 2600, q: 0.8 }); },
  hoot() { tone({ f: 430, f2: 390, dur: 0.18, vol: 0.14 }); tone({ f: 370, f2: 320, dur: 0.26, vol: 0.14, delay: 0.21 }); },

let voicePick = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const en = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  voicePick = en.find(v => /Samantha|Google US English|Karen|Serena|Tessa|Moira|Female/i.test(v.name)) || en[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(html) {
  if (!G.voice || !('speechSynthesis' in window)) return;
  const t = html.replace(/<[^>]+>/g, ' ').replace(/\p{Extended_Pictographic}/gu, '').replace(/[↖→↗✓✨👇️]/g, '')
    .replace(/\+/g, ' plus ').replace(/=/g, ' equals ').replace(/\s+/g, ' ').trim();
  try {
    speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(t); u.rate = 0.95; u.pitch = 1.2;
      if (voicePick) u.voice = voicePick; u.lang = voicePick ? voicePick.lang : 'en-US';
      speechSynthesis.speak(u);
    }, 60);
  } catch (e) {}
}

for (let i = 0; i < CONF_N; i++) {

}

function burst(pos, n, { colors = CONF_COLORS, speed = 5, up = 5, z = 2, size = 1 } = {}) {

/* =====================================================================
   solving flow
   ===================================================================== */

  else if (b.answer[a].tile && needCarry(a) && !b.carry[a + 1].tile) list = [{ t: String(P.colSum[a]), c: INK }, { t: ' → carry ', c: '#9a7a62' }, { t: '1', c: SRC.carry }];
  else list = eqSegs(colParts(a)).concat([{ t: ' = ?', c: INK }]);

});
addEventListener('pointerup', e => { if (drag.tile && e.pointerId === drag.id) release(); });
addEventListener('pointercancel', e => { if (drag.tile && e.pointerId === drag.id) { drag.hover = null; release(); } });

/* =====================================================================
   layout / resize
   ===================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  const L = w / h < 0.95 ? LAY.tall : LAY.wide;
  if (G.L !== L) { G.L = L; relayout(); }
  const hud = Math.min(h * 0.18, $('#hud').getBoundingClientRect().bottom + 4);
  const upp = Math.max(L.w / w, L.h / (h - hud)), F = h + hud;
  G.camDist = (upp * F / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.aspect = w / F; camera.setViewOffset(w, F, 0, 0, w, h); camera.updateProjectionMatrix();
}
function relayout() {
  const L = G.L;
  if (BG.sun) BG.sun.position.set(...L.sun);
  buildTray(); buildPanel();
  if (G.board && !G.boardAnim) G.board.group.position.set(L.board[0], L.board[1], 0);
  if (G.P && G.board && G.board.mode === 'solve') updateTag();
}
addEventListener('resize', resize);

/* =====================================================================
   per-frame updates
   ===================================================================== */
const COL_W = new THREE.Color('#ffffff'), COL_HOV = new THREE.Color('#ffe38a'), COL_PEND = new THREE.Color('#fff1b8'), COL_BAD = new THREE.Color('#ff9a8a');
function pendingSlot() {
  const b = G.board; if (!b || G.busy || G.boardAnim) return null;
  if (b.mode === 'build') return !b.top[0].tile ? b.top[0] : !b.bottom[0].tile ? b.bottom[0] : null;
  const a = G.active; if (a >= b.C) return null;
  if (!b.answer[a].tile) return b.answer[a];
  if (needCarry(a) && !b.carry[a + 1].tile) return b.carry[a + 1];
  return null;
}
function updateBoard(dt, t) {
  const b = G.board; if (!b) return;
  const pend = pendingSlot(), pulse = 0.5 + 0.5 * Math.sin(t * 6);
  for (const s of b.slots) {
    s.flash -= dt;
    s.mesh.visible = !s.tile;
    const hov = drag.hover === s, isP = s === pend;
    s.j.sc.t = hov ? 1.2 : isP ? 1 + 0.06 * pulse : 1;
    s.mesh.material.color.copy(s.flash > 0 ? COL_BAD : hov ? COL_HOV : isP ? COL_PEND : COL_W);
    let op = hov ? 1 : isP ? 0.75 + 0.25 * pulse : 0.55;
    if (b.mode === 'solve' && s.type === 'carry' && !G.P.carries[s.col]) op = 0.28;
    s.mesh.material.opacity = op;
  }
  const act = b.mode === 'solve' && !G.busy && G.active < b.C;
  b.bands.forEach((j, i) => { j.sc.t = act && i === G.active ? 1.025 : 1; j.mesh.position.z = lerp(j.mesh.position.z, act && i === G.active ? 0.05 : 0.03, 0.2); });
  if (b.halo) {
    b.halo.visible = act;
    if (act) { b.halo.position.x = lerp(b.halo.position.x, colX(b.C, G.active), 1 - Math.exp(-dt * 12)); const s = 1 + 0.015 * Math.sin(t * 5); b.halo.scale.set(s, s, 1); }
  }
  if (b.tag) {
    b.tag.mesh.position.x = lerp(b.tag.mesh.position.x, b.tag.x, 1 - Math.exp(-dt * 10));
    b.tag.j.sc.t = G.active < b.C || G.busy ? 1 : 1;
  }
  if (b.arrow) {
    const a = G.active, show = act && b.answer[a] && b.answer[a].tile && needCarry(a) && !b.carry[a + 1].tile;
    b.arrow.visible = !!show;
    if (show) { b.arrow.position.set((colX(b.C, a) + colX(b.C, a + 1) + 0.5) / 2, ROW.carry + 0.52, 0.2); b.arrowJ.sc.t = 1 + 0.08 * Math.sin(t * 7); }
  }
}
function updatePencil(dt, t) {
  const s = pendingSlot();
  const j = pencil.j;
  if (s && !drag.tile) {
    s.mesh.getWorldPosition(_v);
    // answer boxes: pencil comes from the upper right; carry circles: from the upper left (the carry arrow lives on the right)
    const left = s.type === 'carry', r = left ? 0.75 : 1.05, bob = Math.sin(t * 5) * 0.14;
    const tx = _v.x + (r + bob) * 0.72 * (left ? -1 : 1), ty = _v.y + (r + bob) * 0.72;
    j.rot.t = left ? Math.PI * 3 / 4 : Math.PI / 4;
    pencil.pos.x = lerp(pencil.pos.x, tx, 1 - Math.exp(-dt * 9)); pencil.pos.y = lerp(pencil.pos.y, ty, 1 - Math.exp(-dt * 9));
    j.sc.t = 1;
  } else j.sc.t = 0;
  pencil.mesh.position.set(pencil.pos.x, pencil.pos.y, 0.9);
  j.base = G.L.name === 'tall' ? 0.8 : 0.9;
}
function updateTray(dt, t) {
  if (!tray) return;
  tray.tiles.forEach((tt, i) => {
    tt.mesh.position.y = tt.home.y + Math.sin(t * 2 + i * 0.7) * 0.05;
    tt.rot.t = Math.sin(t * 1.5 + i) * 0.04;
    if (tt.sc.t !== 1) tt.sc.t = 1;
  });
  if (tray.glow >= 0) {
    const h = tray.halos[tray.glow], s = 1 + 0.15 * Math.sin(t * 6); h.scale.set(s, s, 1);
    if (Math.floor(t * 1.2) !== Math.floor((t - dt) * 1.2)) { const tt = tray.tiles[tray.glow]; tt.pop(0.4); tt.punch(0.3); }
  }
}
function updateBackground(dt, t) {
  if (BG.rays) BG.rays.rotation.z = t * 0.12;
  for (const c of BG.clouds) { c.m.position.x += c.v * dt; if (c.m.position.x > 34) c.m.position.x = -34; }
  for (const tr of BG.trees) tr.m.rotation.z = Math.sin(t * 1.3 + tr.ph) * 0.04;
}
const _o = new THREE.Vector3();
function updateBubble() {
  if (!G.owl) return;
  const s = G.L.owlS;
  _o.set(G.L.owl[0] + 1.25 * s, G.L.owl[1] + 0.15 * s + G.owl.hop.v, 0.4).project(camera);
  const x = (_o.x + 1) / 2 * innerWidth, y = (1 - _o.y) / 2 * innerHeight;
  const left = x + 18, maxW = Math.max(180, innerWidth - left - 14);
  bubble.style.maxWidth = Math.min(maxW, G.L.name === 'tall' ? 9999 : innerWidth * 0.52) + 'px';
  bubble.style.left = left + 'px';
  const hudB = $('#hud').getBoundingClientRect().bottom + 8, bh = bubble.offsetHeight;
  const top = Math.max(hudB, y - bh / 2);
  bubble.style.top = top + 'px';
  bubble.style.setProperty('--ty', clamp(y - top, 18, bh - 18) + 'px');
  const go = $('#go');
  if (go.classList.contains('show') && G.board) {
    const p = G.board.group.localToWorld(new THREE.Vector3(0, ROW.answer, 0.3)).project(camera);
    go.style.left = (p.x + 1) / 2 * innerWidth + 'px'; go.style.top = (1 - p.y) / 2 * innerHeight + 'px';
  }
}
function updateDrag(dt) {
  if (!drag.tile) return;
  const m = drag.tile.mesh, px = m.position.x;
  m.position.lerp(drag.target, 1 - Math.exp(-dt * 24));
  if (drag.hover) { drag.hover.mesh.getWorldPosition(_v); m.position.x += (_v.x - m.position.x) * 0.1; m.position.y += (_v.y - m.position.y) * 0.1; }
  const vx = (m.position.x - px) / Math.max(dt, 1e-3);
  drag.tile.rot.t = clamp(-vx * 0.045, -0.55, 0.55);
}
function updateIdle() {
  if (!G.started || G.busy || drag.tile || !G.board) return;
  if (G.time - G.lastAct > 16 && !G.nudged) {
    G.nudged = true; G.lastAct = G.time; owlHop(1); sfx.hoot();
    say(`Need a hand? Tap the 💡 button! ${G.prompt}`);
    if (G.board.mode === 'solve') $('#help').classList.add('wiggle');
  }
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  step(dt);
  renderer.render(scene, camera);
  updateBubble();
}
function step(dt) {
  G.time += dt; const t = G.time;
  updateTweens(dt);
  updateDrag(dt);
  for (const j of juicy) j.update(dt);
  updateBoard(dt, t); updatePencil(dt, t); updateTray(dt, t); updateOwl(dt, t); updateBackground(dt, t);
  updateConfetti(dt, t); updateIdle();
  // camera: gentle parallax + shake
  par.x = lerp(par.x, par.tx, 1 - Math.exp(-dt * 3)); par.y = lerp(par.y, par.ty, 1 - Math.exp(-dt * 3));
  G.shake *= Math.exp(-dt * 7);
  const sx = (Math.random() - 0.5) * G.shake, sy = (Math.random() - 0.5) * G.shake;
  camera.position.set(par.x * 0.9 + sx, par.y * 0.6 + sy, G.camDist);
  camera.lookAt(par.x * 0.2, par.y * 0.12, 0);
}

/* =====================================================================
   boot
   ===================================================================== */
(function titleLetters() {
  const cols = ['#e8574a', '#f08a3c', '#e9a825', '#6fae52', '#2f9e97', '#3f7fc1', '#7a5cc4', '#d9508f', '#a0643b', '#e8574a'];
  $('#title').innerHTML = [...'Paper Sums'].map((ch, i) => ch === ' ' ? '<span style="width:.3em"></span>'
    : `<span style="color:${cols[i]};--r2:${(i % 2 ? 1 : -1) * 4}deg;animation-delay:${i * 0.12}s;transform:rotate(${(i % 3 - 1) * 4}deg)">${ch}</span>`).join('');
})();
$('#starCount').textContent = G.stars;

async function boot() {
  try { await Promise.race([Promise.all([document.fonts.load('700 100px Fredoka'), document.fonts.load('600 100px Fredoka')]), new Promise(r => setTimeout(r, 3000))]); } catch (e) {}
  initDigits(); buildBackground(); buildOwl(); buildPencil();
  resize();
  requestAnimationFrame(frame);
  const play = $('#play'); play.disabled = false; play.textContent = "Let's play!";
  const start = () => {
    if (G.started) return;
    ensureAudio(); G.started = true; $('#start').classList.add('hide'); sfx.whoosh(); owlCheer();
    setTimeout(() => $('#start').remove(), 600);
    nextRound();
  };
  play.addEventListener('click', start);
}
boot();
</script>
</body>
