<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pip's Paper School</title>
<meta name="description" content="Playful paper cut-out maths games for kids aged 5–9, in English and Polish.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fffaf0; --ink:#4a3426; --ink2:#7a5d49;
    --tomato:#e8574a; --teal:#2f9e97; --mustard:#f2c14e;
    --pop:0 5px 0 rgba(74,52,38,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fbd9b0;font-family:'Fredoka','Baloo 2',system-ui,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #app canvas{display:block;touch-action:none}
  button{font-family:inherit}
  .hidden{display:none !important}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:5;pointer-events:none}
  .group{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;position:relative}
  .btn{font-weight:600;font-size:17px;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:14px;
    height:46px;min-width:46px;padding:0 11px;box-shadow:var(--pop);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .12s, background .2s, opacity .2s;white-space:nowrap}
  .btn:hover{transform:translateY(-2px) rotate(-2deg)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,52,38,.25)}
  .btn .emo{font-size:21px;line-height:1}
  .btn.sel{background:var(--mustard)}
  #home{background:#cde6f5}
  #help{background:#ffe27a}
  #help.wiggle{animation:wig 1.1s ease-in-out infinite}
  @keyframes wig{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg) scale(1.1)}80%{transform:rotate(10deg) scale(1.1)}90%{transform:rotate(-6deg)}}
  #stars{cursor:default}
  #stars:hover{transform:none}
  #stars.bump{animation:bump .5s}
  @keyframes bump{30%{transform:scale(1.35) rotate(-8deg)}}
  #menu{position:absolute;right:0;top:54px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:var(--pop);
    padding:8px;display:flex;flex-direction:column;gap:6px;min-width:220px}
  #menu .btn{justify-content:flex-start;width:100%;box-shadow:none;border-width:2px;height:42px}
  #menu .btn:hover{transform:none;background:#fff3dc}
  @media (max-width:760px){ .btn .lbl{display:none} .btn{height:42px;min-width:42px;padding:0 7px;font-size:16px} .group{gap:5px} #menu .btn .lbl{display:inline} }
  @media (max-width:440px){ #hud{left:8px;right:8px;gap:6px} .btn{height:38px;min-width:38px;padding:0 5px;border-radius:12px;font-size:15px}
    .btn .emo{font-size:18px} .group{gap:4px;flex-wrap:nowrap} #menu{top:46px} }

  /* ---------- speech bubble ---------- */
  #bubble{position:fixed;left:0;top:0;z-index:4;background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:10px 16px;
    box-shadow:var(--pop);font-weight:600;font-size:clamp(15px,1.85vw,22px);line-height:1.35;pointer-events:none;opacity:0;transition:opacity .3s;--ty:50%}
  #bubble.show{opacity:1}
  #bubble::before{content:"";position:absolute;left:-16px;top:calc(var(--ty) - 11px);border:11px solid transparent;border-right:15px solid var(--ink);border-left:0}
  #bubble::after{content:"";position:absolute;left:-10px;top:calc(var(--ty) - 8px);border:8px solid transparent;border-right:11px solid var(--cream);border-left:0}
  #bubbleText{display:block;transform-origin:left center}
  #bubbleText.pop{animation:pop .42s cubic-bezier(.3,1.7,.5,1)}
  @keyframes pop{0%{transform:scale(.75);opacity:.3}100%{transform:scale(1);opacity:1}}
  #bubble b{color:var(--tomato)}
  .ca{color:#d99a1e;font-weight:700}.sa{color:#e8574a;font-weight:700}.sb{color:#2f9e97;font-weight:700}

  /* ---------- build-mode go button ---------- */
  #go{position:fixed;left:50%;top:50%;z-index:4;display:none;transform:translate(-50%,-50%);font-size:24px;font-weight:700;color:#fff;
    background:var(--tomato);border:3px solid var(--ink);border-radius:18px;padding:10px 24px;box-shadow:0 6px 0 rgba(74,52,38,.3);cursor:pointer}
  #go.show{display:block;animation:goPop .5s cubic-bezier(.3,1.7,.5,1), goPulse 1.4s .5s ease-in-out infinite}
  @keyframes goPop{0%{transform:translate(-50%,-50%) scale(.3)}100%{transform:translate(-50%,-50%) scale(1)}}
  @keyframes goPulse{50%{transform:translate(-50%,-50%) scale(1.07) rotate(-2deg)}}

  /* ---------- start screen ---------- */
  #start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(251,217,176,.55);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .5s}
  #start.hide{opacity:0;pointer-events:none}
  .card{text-align:center;padding:20px}
  .title{font-size:clamp(40px,10vw,112px);font-weight:700;line-height:1.05;filter:drop-shadow(5px 7px 0 rgba(74,52,38,.22))}
  .title .word{display:inline-block;white-space:nowrap;margin:0 .15em}
  .title .word span{display:inline-block;animation:bob 2.4s ease-in-out infinite;
    text-shadow:0 5px 0 #fffaf0,0 -5px 0 #fffaf0,5px 0 0 #fffaf0,-5px 0 0 #fffaf0,4px 4px 0 #fffaf0,-4px 4px 0 #fffaf0,4px -4px 0 #fffaf0,-4px -4px 0 #fffaf0}
  @keyframes bob{50%{transform:translateY(-8px) rotate(var(--r2))}}
  .sub{font-size:clamp(18px,2.6vw,26px);font-weight:600;margin:18px 0 26px}
  .sub b{color:var(--tomato)}
  #play{font-size:30px;font-weight:700;color:#fff;background:var(--teal);border:4px solid var(--ink);border-radius:22px;padding:14px 46px;
    box-shadow:0 7px 0 rgba(74,52,38,.3);cursor:pointer;transition:transform .15s}
  #play:hover{transform:scale(1.06) rotate(-2deg)}
  #play:disabled{opacity:.6;cursor:wait}
  .tiny{margin-top:18px;font-size:16px;color:var(--ink2)}
  .langs{margin-top:18px;display:inline-flex;gap:6px}
  .langs .btn{height:40px;font-size:16px}

  /* ---------- parent corner ---------- */
  #parents{position:fixed;inset:0;z-index:12;background:rgba(74,52,38,.35);display:flex;align-items:center;justify-content:center;padding:16px}
  .pbox{background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--pop);width:min(780px,100%);max-height:88vh;overflow:auto;padding:18px 20px;
    -webkit-user-select:text;user-select:text}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .phead h2{margin:0;font-size:26px}
  #pGate{text-align:center;padding:18px 0;font-size:20px;font-weight:600}
  #pGate input{font:inherit;font-size:22px;width:120px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:6px;margin:12px 8px;background:#fff}
  #pErr{color:var(--tomato);min-height:24px}
  .psum{font-weight:600;color:var(--ink2);margin-bottom:12px}
  .ptable{width:100%;border-collapse:collapse;font-size:15px}
  .ptable th,.ptable td{text-align:left;padding:6px 8px;border-bottom:2px dashed #e9dcc4}
  .ptable th{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
  .ptable td.n{text-align:right;font-variant-numeric:tabular-nums}
  .pmist{margin:14px 0 6px;font-size:15px}
  .pmist h3{margin:14px 0 6px;font-size:18px}
  .pmist ul{margin:4px 0 10px;padding-left:20px}
  .prow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
  .prow label{display:flex;gap:8px;align-items:center;font-weight:600}
  .prow input{width:22px;height:22px}
  #pReset{background:#f9d3dc}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="group">
    <button class="btn hidden" id="home"><span class="emo">🏠</span></button>
    <div class="group" id="levels"></div>
  </div>
  <div class="group">
    <div class="btn" id="stars"><span class="emo">⭐</span><span id="starCount">0</span></div>
    <button class="btn hidden" id="help"><span class="emo">💡</span><span class="lbl" data-i18n="help">Help</span></button>
    <button class="btn" id="gear"><span class="emo">⚙️</span></button>
    <div id="menu" class="hidden">
      <button class="btn" id="mSound"><span class="emo">🔊</span><span class="lbl"></span></button>
      <button class="btn" id="mVoice"><span class="emo">🗣️</span><span class="lbl"></span></button>
      <button class="btn" id="mLang"><span class="emo">🌍</span><span class="lbl"></span></button>
      <button class="btn" id="mParents"><span class="emo">👪</span><span class="lbl"></span></button>
    </div>
  </div>
</div>

<div id="parents" class="hidden"><div class="pbox">
  <div class="phead"><h2 id="pTitle"></h2><button class="btn" id="pClose">✕</button></div>
  <div id="pGate"><div id="pQ"></div><input id="pA" inputmode="numeric" autocomplete="off"><button class="btn" id="pGo"></button><div id="pErr"></div></div>
  <div id="pBody" class="hidden"></div>
</div></div>

<div id="bubble"><span id="bubbleText"></span></div>
<button id="go"></button>

<div id="start">
  <div class="card">
    <div class="title" id="title"></div>
    <div class="sub" id="subtitle"></div>
    <button id="play" disabled data-i18n="loading">Loading…</button>
    <div class="tiny" data-i18n="tiny"></div>
    <div class="langs"><button class="btn" data-lang="en">English</button><button class="btn" data-lang="pl">Polski</button></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module" src="app.js"></script>
<script>
  // Browsers won't load JavaScript modules from file:// — explain instead of hanging on "Loading…"
  if (location.protocol === 'file:') {
    const play = document.getElementById('play');
    play.textContent = '🙈';
    play.insertAdjacentHTML('afterend', `<div class="tiny" style="max-width:520px;margin:18px auto 0;font-size:17px;color:var(--ink)">
      This page needs a tiny web server (browsers block games opened straight from a file).<br>
      In this folder run <b>python3 -m http.server 8000</b> and open <b>http://localhost:8000</b><br>
      — or play online at <a href="https://dondany.github.io/count/">dondany.github.io/count</a></div>`);
  }
</script>
</body>
</html>
